<title>SAMANVAYA Clinical Console</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap">
<style>
  :root {
    --ground: #F8FAFC;
    --surface: #FFFFFF;
    --ink: #1E293B;
    --ink-soft: #64748B;
    --border: #E2E8F0;
    --sidebar-bg: #0A4D3C;
    --sidebar-hover: #0D6150;
    --sidebar-text: #A7C4BC;
    --primary: #0F766E;
    --primary-hover: #0A4D3C;
    --allopathy: #2563EB;
    --allopathy-bg: #EFF6FF;
    --ayush: #C2740C;
    --ayush-bg: #FEF3C7;
    --danger: #DC2626;
    --danger-bg: #FEE2E2;
    --success: #16A34A;
    --success-bg: #F0FDF4;
    --warning: #EA580C;
    --warning-bg: #FFF7ED;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0F172A;
      --surface: #1E293B;
      --ink: #F1F5F9;
      --ink-soft: #94A3B8;
      --border: #334155;
      --sidebar-bg: #0A2820;
      --sidebar-hover: #0D3D32;
      --sidebar-text: #6B9186;
      --allopathy-bg: #1E3A8A;
      --ayush-bg: #78350F;
      --danger-bg: #7F1D1D;
      --success-bg: #14532D;
      --warning-bg: #7C2D12;
    }
  }

  :root[data-theme="dark"] {
    --ground: #0F172A;
    --surface: #1E293B;
    --ink: #F1F5F9;
    --ink-soft: #94A3B8;
    --border: #334155;
    --sidebar-bg: #0A2820;
    --sidebar-hover: #0D3D32;
    --sidebar-text: #6B9186;
    --allopathy-bg: #1E3A8A;
    --ayush-bg: #78350F;
    --danger-bg: #7F1D1D;
    --success-bg: #14532D;
    --warning-bg: #7C2D12;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .shell {
    display: flex;
    min-height: 100vh;
  }

  /* Sidebar */
  .sidebar {
    width: 260px;
    flex-shrink: 0;
    background: var(--sidebar-bg);
    display: flex;
    flex-direction: column;
    padding: 24px 0;
  }

  .sidebar-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 20px 24px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    margin-bottom: 20px;
  }

  .logo-mark {
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, var(--primary), var(--ayush));
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 700;
    font-size: 20px;
    flex-shrink: 0;
  }

  .sidebar-brand .name {
    font-family: 'IBM Plex Sans', sans-serif;
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    line-height: 1.2;
  }

  .sidebar-brand .sub {
    color: var(--sidebar-text);
    font-size: 11px;
    letter-spacing: 0.03em;
    margin-top: 2px;
  }

  .nav-section-label {
    color: rgba(255,255,255,0.4);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 8px 20px;
    margin: 16px 0 8px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    color: var(--sidebar-text);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: all 0.15s ease;
  }

  .nav-item:hover {
    background: var(--sidebar-hover);
    color: #fff;
  }

  .nav-item.active {
    background: var(--sidebar-hover);
    color: #fff;
    border-left-color: var(--ayush);
  }

  .nav-item svg {
    flex-shrink: 0;
  }

  .sidebar-footer {
    margin-top: auto;
    padding: 20px 20px 0;
    border-top: 1px solid rgba(255,255,255,0.1);
  }

  .doctor-chip {
    display: flex;
    align-items: center;
    gap: 12px;
    padding-top: 16px;
  }

  .doctor-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--ayush);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .doctor-chip .who {
    color: #fff;
    font-size: 14px;
    font-weight: 600;
  }

  .doctor-chip .role {
    color: var(--sidebar-text);
    font-size: 12px;
  }

  /* Main content */
  .main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    height: 72px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
    flex-shrink: 0;
  }

  .topbar .page-title {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--ink);
  }

  .topbar .page-sub {
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 2px;
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .icon-btn {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink-soft);
    cursor: pointer;
    position: relative;
    transition: all 0.15s ease;
  }

  .icon-btn:hover {
    background: var(--ground);
    color: var(--ink);
  }

  .icon-btn .dot-badge {
    position: absolute;
    top: -2px;
    right: -2px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--danger);
    border: 2px solid var(--surface);
  }

  .content {
    padding: 32px;
    flex: 1;
    overflow-y: auto;
  }

  /* Stat cards */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
    margin-bottom: 32px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
  }

  .stat-card .icon-wrap {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
  }

  .stat-card .val {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 32px;
    font-weight: 700;
    line-height: 1;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  .stat-card .label {
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 8px;
  }

  /* Panels */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
  }

  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .panel h2 {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 18px;
    font-weight: 700;
    margin: 0;
    color: var(--ink);
  }

  .panel .sub {
    color: var(--ink-soft);
    font-size: 13px;
    margin-top: 4px;
  }

  .section-gap {
    margin-top: 28px;
  }

  /* Table */
  .table {
    width: 100%;
    border-collapse: collapse;
  }

  .table th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    font-weight: 600;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }

  .table td {
    padding: 14px 16px;
    font-size: 14px;
    border-bottom: 1px solid var(--border);
  }

  .table tr:last-child td {
    border-bottom: none;
  }

  .table tr:hover td {
    background: var(--ground);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 600;
  }

  .badge.success {
    background: var(--success-bg);
    color: var(--success);
  }

  .badge.danger {
    background: var(--danger-bg);
    color: var(--danger);
  }

  .badge.warning {
    background: var(--warning-bg);
    color: var(--warning);
  }

  .badge.pending {
    background: var(--ground);
    color: var(--ink-soft);
  }

  .badge.allopathy {
    background: var(--allopathy-bg);
    color: var(--allopathy);
  }

  .badge.ayush {
    background: var(--ayush-bg);
    color: var(--ayush);
  }

  .empty-state {
    text-align: center;
    padding: 64px 20px;
    color: var(--ink-soft);
    font-size: 14px;
  }

  /* Buttons */
  .btn {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    padding: 12px 24px;
    border-radius: 10px;
    border: none;
    background: var(--primary);
    color: #fff;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: background 0.15s ease;
  }

  .btn:hover {
    background: var(--primary-hover);
  }

  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .btn.secondary {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--border);
  }

  .btn.secondary:hover {
    background: var(--ground);
  }

  /* Forms */
  .field {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 20px;
  }

  .field label {
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .field input,
  .field select,
  .field textarea {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--ground);
    color: var(--ink);
  }

  .field input:focus,
  .field select:focus,
  .field textarea:focus {
    outline: 2px solid var(--primary);
    outline-offset: 0;
  }

  .field textarea {
    min-height: 120px;
    resize: vertical;
  }

  .row {
    display: flex;
    gap: 20px;
  }

  .row .field {
    flex: 1;
  }

  /* Horizontal stepper */
  .h-stepper {
    display: flex;
    align-items: center;
    margin-bottom: 32px;
    overflow-x: auto;
    padding-bottom: 8px;
  }

  .h-step {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .h-step .circle {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    border: 2px solid var(--border);
    color: var(--ink-soft);
    background: var(--surface);
  }

  .h-step.active .circle {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }

  .h-step.done .circle {
    background: var(--success);
    border-color: var(--success);
    color: #fff;
  }

  .h-step .label {
    font-size: 13px;
    color: var(--ink-soft);
    white-space: nowrap;
  }

  .h-step.active .label {
    color: var(--ink);
    font-weight: 600;
  }

  .h-line {
    width: 32px;
    height: 2px;
    background: var(--border);
    flex-shrink: 0;
    margin: 0 8px;
  }

  /* Entity pills */
  .entity-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 16px 0;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    padding: 6px 14px;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 500;
    background: var(--ground);
    color: var(--ink);
    border: 1px solid var(--border);
  }

  .pill.allopathy {
    background: var(--allopathy-bg);
    color: var(--allopathy);
    border-color: var(--allopathy);
  }

  .pill.ayush {
    background: var(--ayush-bg);
    color: var(--ayush);
    border-color: var(--ayush);
  }

  /* Result card */
  .result-card {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 24px;
    background: var(--ground);
    overflow-x: auto;
  }

  .result-row {
    display: flex;
    gap: 16px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }

  .result-row:last-child {
    border-bottom: none;
  }

  .result-key {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--ink-soft);
    min-width: 160px;
    flex-shrink: 0;
  }

  .result-val {
    font-family: 'IBM Plex Mono', monospace;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--ink);
  }

  /* Alert banner */
  .alert-banner {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    background: var(--danger-bg);
    border: 1px solid var(--danger);
    color: var(--danger);
    border-radius: 10px;
    padding: 16px 18px;
    font-size: 14px;
    margin-bottom: 24px;
    font-weight: 500;
  }

  .alert-banner svg {
    flex-shrink: 0;
    margin-top: 2px;
  }

  /* Footer actions */
  .footer-actions {
    display: flex;
    gap: 12px;
    margin-top: 28px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
  }

  .error-text {
    color: var(--danger);
    font-size: 13px;
    margin-top: 12px;
    font-weight: 500;
  }

  /* Merge visual */
  .merge-visual {
    display: flex;
    align-items: center;
    gap: 24px;
    margin: 8px 0 28px;
  }

  .merge-labels {
    display: flex;
    flex-direction: column;
    gap: 10px;
    font-size: 13px;
  }

  .merge-labels span {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }

  .dot.allopathy {
    background: var(--allopathy);
  }

  .dot.ayush {
    background: var(--ayush);
  }

  /* Patient preset buttons */
  .preset-btn {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    padding: 10px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
    text-align: left;
    transition: all 0.15s ease;
  }

  .preset-btn:hover {
    background: var(--ground);
    border-color: var(--primary);
  }

  .preset-btn .name {
    font-weight: 600;
    margin-bottom: 2px;
  }

  .preset-btn .meta {
    font-size: 11px;
    color: var(--ink-soft);
  }

  .preset-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
</style>

<div id="root"></div>

// Consultation flow
function ConsultationFlow({ onComplete }) {
  const [step, setStep] = useState(0);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  const [patientForm, setPatientForm] = useState({ name: "", age: "", sex: "M" });
  const [patientId, setPatientId] = useState("");
  const [consultId, setConsultId] = useState("");
  const [transcript, setTranscript] = useState(
    "Patient is diabetic and complains of fatigue. Currently taking Metformin 500mg twice daily and methi 1 tsp daily."
  );
  const [extracted, setExtracted] = useState(null);
  const [reconciled, setReconciled] = useState(null);
  const [interactions, setInteractions] = useState(null);
  const [approved, setApproved] = useState(null);
  const [summary, setSummary] = useState(null);

  async function call(path, method = "POST", body) {
    setLoading(true);
    setError("");
    try {
      const res = await fetch(`${API}${path}`, {
        method,
        headers: { "Content-Type": "application/json" },
        body: body ? JSON.stringify(body) : undefined,
      });
      if (!res.ok) throw new Error(`Request failed (${res.status})`);
      return await res.json();
    } catch (e) {
      setError(e.message || "Something went wrong. Is the backend running on port 8000?");
      throw e;
    } finally {
      setLoading(false);
    }
  }

  const alerts = interactions?.alerts || [];
  const hasAlert = alerts.length > 0;

  async function createPatient() {
    const data = await call("/patients", "POST", {
      name: patientForm.name,
      age: Number(patientForm.age),
      sex: patientForm.sex
    });
    setPatientId(data.id);
    setStep(1);
  }

  async function startConsult() {
    const data = await call("/consult", "POST", { patient_id: patientId, consent: true });
    setConsultId(data.id);
    setStep(2);
  }

  async function submitTranscript() {
    await call(`/consult/${consultId}/transcribe`, "POST", { text: transcript });
    setStep(3);
  }

  async function extractEntities() {
    const data = await call(`/consult/${consultId}/extract`, "POST");
    setExtracted(data);
    setStep(4);
  }

  async function reconcileMeds() {
    const data = await call(`/consult/${consultId}/reconcile`, "POST");
    setReconciled(data);
    setStep(5);
  }

  async function checkInteractions() {
    const data = await call(`/consult/${consultId}/check`, "POST");
    setInteractions(data);
    setStep(6);
  }

  async function approve() {
    const data = await call(`/consult/${consultId}/approve`, "POST");
    setApproved(data);
    onComplete({
      consultId,
      patientId,
      name: patientForm.name,
      age: patientForm.age,
      sex: patientForm.sex,
      status: "approved",
      hasAlert,
    });
    setStep(7);
  }

  async function getSummary() {
    const data = await call(`/consult/${consultId}`, "GET");
    setSummary(data);
  }

  function usePreset(preset) {
    setPatientForm(preset);
  }

  return React.createElement('div', { className: 'content' },
    React.createElement('div', { className: 'panel' },
      React.createElement('div', { className: 'h-stepper' },
        ...STEPS.map((label, i) =>
          React.createElement('div', { key: label, style: { display: 'flex', alignItems: 'center' } },
            React.createElement('div', { className: `h-step ${i === step ? 'active' : ''} ${i < step ? 'done' : ''}` },
              React.createElement('div', { className: 'circle' }, i < step ? '✓' : i + 1),
              React.createElement('div', { className: 'label' }, label)
            ),
            i < STEPS.length - 1 && React.createElement('div', { className: 'h-line' })
          )
        )
      ),

      step === 0 && React.createElement('div', null,
        React.createElement('h2', null, 'New patient'),
        React.createElement('p', { className: 'sub' }, 'Register the patient to begin a consultation.'),
        React.createElement('div', { className: 'section-gap' }),
        React.createElement('div', { className: 'preset-grid' },
          ...PRESET_PATIENTS.map((preset, i) =>
            React.createElement('button', {
              key: i,
              className: 'preset-btn',
              onClick: () => usePreset(preset)
            },
              React.createElement('div', { className: 'name' }, preset.name),
              React.createElement('div', { className: 'meta' }, `${preset.age}y, ${preset.sex} · ${preset.meta}`)
            )
          )
        ),
        React.createElement('div', { className: 'field' },
          React.createElement('label', null, 'Full name'),
          React.createElement('input', {
            value: patientForm.name,
            onChange: e => setPatientForm({ ...patientForm, name: e.target.value }),
            placeholder: "Rajesh Kumar"
          })
        ),
        React.createElement('div', { className: 'row' },
          React.createElement('div', { className: 'field' },
            React.createElement('label', null, 'Age'),
            React.createElement('input', {
              type: 'number',
              value: patientForm.age,
              onChange: e => setPatientForm({ ...patientForm, age: e.target.value }),
              placeholder: "55"
            })
          ),
          React.createElement('div', { className: 'field' },
            React.createElement('label', null, 'Sex'),
            React.createElement('select', {
              value: patientForm.sex,
              onChange: e => setPatientForm({ ...patientForm, sex: e.target.value })
            },
              React.createElement('option', { value: 'M' }, 'Male'),
              React.createElement('option', { value: 'F' }, 'Female'),
              React.createElement('option', { value: 'O' }, 'Other')
            )
          )
        ),
        React.createElement('div', { className: 'footer-actions' },
          React.createElement('button', {
            className: 'btn',
            disabled: loading || !patientForm.name,
            onClick: createPatient
          }, loading ? 'Creating…' : 'Create patient')
        )
      ),

      step === 1 && React.createElement('div', null,
        React.createElement('h2', null, 'Start consultation'),
        React.createElement('p', { className: 'sub' }, 'Patient registered. Begin with consent recorded.'),
        React.createElement(ResultCard, { data: { patient_id: patientId } }),
        React.createElement('div', { className: 'footer-actions' },
          React.createElement('button', {
            className: 'btn',
            disabled: loading,
            onClick: startConsult
          }, loading ? 'Starting…' : 'Start consultation')
        )
      ),

      step === 2 && React.createElement('div', null,
        React.createElement('h2', null, 'Transcribe consultation'),
        React.createElement('p', { className: 'sub' }, 'Enter or paste the consultation notes.'),
        React.createElement('div', { className: 'field' },
          React.createElement('label', null, 'Consultation text'),
          React.createElement('textarea', {
            value: transcript,
            onChange: e => setTranscript(e.target.value)
          })
        ),
        React.createElement('div', { className: 'footer-actions' },
          React.createElement('button', {
            className: 'btn',
            disabled: loading,
            onClick: submitTranscript
          }, loading ? 'Saving…' : 'Submit transcript')
        )
      ),

      step === 3 && React.createElement('div', null,
        React.createElement('h2', null, 'Extract clinical entities'),
        React.createElement('p', { className: 'sub' }, 'Pull symptoms, conditions and medications from the transcript.'),
        React.createElement('div', { className: 'footer-actions' },
          React.createElement('button', {
            className: 'btn',
            disabled: loading,
            onClick: extractEntities
          }, loading ? 'Extracting…' : 'Extract entities')
        )
      ),

      step === 4 && React.createElement('div', null,
        React.createElement('h2', null, 'Extracted entities'),
        React.createElement('p', { className: 'sub' }, 'Symptoms, conditions and medications identified.'),
        React.createElement(ResultCard, { data: extracted }),
        React.createElement('div', { className: 'footer-actions' },
          React.createElement('button', {
            className: 'btn',
            disabled: loading,
            onClick: reconcileMeds
          }, loading ? 'Reconciling…' : 'Reconcile medicines')
        )
      ),

      step === 5 && React.createElement('div', null,
        React.createElement('h2', null, 'Reconciled medicine profile'),
        React.createElement('p', { className: 'sub' }, 'Allopathy and AYUSH medicines unified into one profile.'),
        React.createElement(MergeVisual),
        React.createElement(ResultCard, { data: reconciled }),
        React.createElement('div', { className: 'footer-actions' },
          React.createElement('button', {
            className: 'btn',
            disabled: loading,
            onClick: checkInteractions
          }, loading ? 'Checking…' : 'Check interactions')
        )
      ),

      step === 6 && React.createElement('div', null,
        React.createElement('h2', null, 'Interaction check'),
        React.createElement('p', { className: 'sub' }, 'Cross-checked against the interaction knowledge base.'),
        hasAlert && React.createElement('div', { className: 'alert-banner' },
          React.createElement(Ic.Alert),
          'Interaction alert detected — review before approving.'
        ),
        React.createElement(ResultCard, { data: interactions }),
        React.createElement('div', { className: 'footer-actions' },
          React.createElement('button', {
            className: 'btn',
            disabled: loading,
            onClick: approve
          }, loading ? 'Saving…' : 'Approve and save')
        )
      ),

      step === 7 && React.createElement('div', null,
        React.createElement('h2', null, 'Consultation approved'),
        React.createElement('p', { className: 'sub' }, 'Saved to the record.'),
        React.createElement(ResultCard, { data: approved }),
        React.createElement('div', { className: 'footer-actions' },
          React.createElement('button', {
            className: 'btn secondary',
            disabled: loading,
            onClick: getSummary
          },
            React.createElement(Ic.File),
            loading ? 'Loading…' : 'View full FHIR record'
          )
        ),
        summary && React.createElement('div', null,
          React.createElement('h2', { className: 'section-gap' }, 'Full record'),
          React.createElement(ResultCard, { data: summary })
        )
      ),

      error && React.createElement('div', { className: 'error-text' }, error)
    )
  );
}

// App shell
function App() {
  const [view, setView] = useState("dashboard");
  const [consultations, setConsultations] = useState([]);

  const titles = {
    dashboard: ["Dashboard", "Overview of today's consultations"],
    consultation: ["New Consultation", "Allopathy × AYUSH medication reconciliation"],
    patients: ["Patients", "Registered patients this session"],
  };

  return React.createElement('div', { className: 'shell' },
    React.createElement(Sidebar, { view, setView }),
    React.createElement('div', { className: 'main' },
      React.createElement(Topbar, {
        title: titles[view][0],
        sub: titles[view][1],
        alertCount: consultations.filter(c => c.hasAlert).length
      }),
      view === "dashboard" && React.createElement(Dashboard, { consultations, setView }),
      view === "consultation" && React.createElement(ConsultationFlow, {
        onComplete: c => setConsultations(prev => [c, ...prev])
      }),
      view === "patients" && React.createElement(PatientsView, { consultations })
    )
  );
}

ReactDOM.render(React.createElement(App), document.getElementById('root'));
</script>
