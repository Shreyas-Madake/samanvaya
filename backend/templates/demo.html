<title>SAMANVAYA Demo with Mock Data</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    background: #F8FAFC;
    color: #1E293B;
  }
  .badge {
    font-weight: 600;
    padding: 0.375rem 0.875rem;
    border-radius: 9999px;
    font-size: 0.8125rem;
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
  }
  .badge-allopathy {
    background: #EFF6FF;
    color: #2563EB;
    border: 1px solid #BFDBFE;
  }
  .badge-ayush {
    background: #F0FDF4;
    color: #16A34A;
    border: 1px solid #BBF7D0;
  }
  .badge-symptom {
    background: #FFF7ED;
    color: #EA580C;
    border: 1px solid #FED7AA;
  }
  .badge-condition {
    background: #F5F3FF;
    color: #7C3AED;
    border: 1px solid #DDD6FE;
  }
  .card-high-risk {
    border-left: 4px solid #DC2626;
    background: #FEF2F2;
    border: 1px solid #FCA5A5;
    border-left-width: 4px;
  }
  .med-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
  }
  .med-table th {
    text-align: left;
    font-size: 0.6875rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #64748B;
    font-weight: 600;
    padding: 0.75rem 1rem;
    border-bottom: 1px solid #E2E8F0;
    background: #F8FAFC;
  }
  .med-table td {
    padding: 0.875rem 1rem;
    font-size: 0.875rem;
    border-bottom: 1px solid #F1F5F9;
  }
  .med-table tr:hover td {
    background: #F8FAFC;
  }
</style>

<div class="min-h-screen bg-slate-50 p-8">
  <div class="max-w-4xl mx-auto">
    <div class="bg-white rounded-xl shadow-lg border border-slate-200 p-8 mb-8">
      <h1 class="text-2xl font-bold text-slate-900 mb-2">SAMANVAYA Clinical UI Demo</h1>
      <p class="text-slate-600 mb-6">This shows how the backend data is transformed into judge-ready UI components</p>

      <button onclick="loadDemo()" class="bg-teal-600 hover:bg-teal-700 text-white font-semibold py-3 px-6 rounded-lg">
        Load Demo Data
      </button>
    </div>

    <div id="results" class="space-y-6"></div>
  </div>
</div>

<script>
const MOCK_EXTRACTED = {
  "id": "abc-123",
  "patient_id": "patient-456",
  "status": "extracted",
  "consent": true,
  "transcript": "Patient is diabetic and takes Glycomet 500mg twice daily. He also complains of fever, I will prescribe Crocin. He mentions taking Methi seeds 1 tsp daily.",
  "entities": {
    "symptoms": ["fever", "fatigue"],
    "conditions": ["Type 2 Diabetes"],
    "medications": [
      {"name": "Glycomet", "dosage": "500mg", "frequency": "twice daily", "system": "allopathy"},
      {"name": "Crocin", "dosage": "500mg", "frequency": "as needed", "system": "allopathy"},
      {"name": "Methi", "dosage": "1 tsp", "frequency": "daily", "system": "ayush"}
    ]
  }
};

const MOCK_RECONCILED = {
  "med_profile": {
    "allopathy": [
      {"norm_name": "Metformin", "name": "Glycomet", "dosage": "500mg", "frequency": "twice daily"},
      {"norm_name": "Paracetamol", "name": "Crocin", "dosage": "500mg", "frequency": "as needed"}
    ],
    "ayush": [
      {"norm_name": "Fenugreek", "name": "Methi", "dosage": "1 tsp", "frequency": "daily"}
    ],
    "unrecognized": []
  }
};

const MOCK_ALERTS = {
  "alerts": [
    {
      "interaction_id": "int-metformin-fenugreek",
      "drug_a": {"id": "drug:metformin", "name": "Metformin", "original": "Glycomet"},
      "drug_b": {"id": "herb:fenugreek", "name": "Fenugreek", "original": "Methi"},
      "risk": "high",
      "effect": "Additive hypoglycemic effect",
      "mechanism": "Both lower blood glucose; combined effect increases hypoglycemia risk",
      "recommendation": "Monitor blood glucose closely. Consider dose adjustment.",
      "condition_match": true,
      "matched_conditions": ["Type 2 Diabetes"],
      "evidence": [
        {"source": "Journal of Ethnopharmacology", "reference": "doi:10.1016/j.jep.2009.04.018"}
      ]
    }
  ]
};

function loadDemo() {
  const container = document.getElementById('results');
  container.innerHTML = '';

  // Extracted entities
  container.innerHTML += renderClinicalNote(MOCK_EXTRACTED);

  // Reconciled profile
  container.innerHTML += renderReconciledProfile(MOCK_RECONCILED);

  // Safety alerts
  container.innerHTML += renderSafetyAlerts(MOCK_ALERTS);
}

function renderClinicalNote(data) {
  const entities = data.entities || {};
  const symptoms = entities.symptoms || [];
  const conditions = entities.conditions || [];
  const medications = entities.medications || [];
  const transcript = data.transcript || '';

  let html = '<div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">';
  html += '<h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">';
  html += '<span>📋</span> Extracted Clinical Note</h2>';
  html += '<div class="space-y-5">';

  // Transcript
  if (transcript) {
    html += `
      <div>
        <h3 class="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Transcript</h3>
        <blockquote class="border-l-4 border-teal-500 bg-slate-50 p-4 rounded-r-lg text-sm text-slate-700 italic">
          "${transcript}"
        </blockquote>
      </div>
    `;
  }

  // Symptoms
  html += '<div>';
  html += '<h3 class="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Symptoms</h3>';
  if (symptoms.length > 0) {
    html += '<div class="flex flex-wrap gap-2">';
    symptoms.forEach(symptom => {
      html += `<span class="badge badge-symptom">🤒 ${symptom}</span>`;
    });
    html += '</div>';
  } else {
    html += '<p class="text-sm text-slate-400 italic">No symptoms reported</p>';
  }
  html += '</div>';

  // Conditions
  html += '<div>';
  html += '<h3 class="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Conditions</h3>';
  if (conditions.length > 0) {
    html += '<div class="flex flex-wrap gap-2">';
    conditions.forEach(condition => {
      html += `<span class="badge badge-condition">🩸 ${condition}</span>`;
    });
    html += '</div>';
  } else {
    html += '<p class="text-sm text-slate-400 italic">No existing conditions</p>';
  }
  html += '</div>';

  // Medications table
  html += '<div>';
  html += '<h3 class="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Medications</h3>';
  if (medications.length > 0) {
    html += '<div class="border border-slate-200 rounded-lg overflow-hidden">';
    html += '<table class="med-table">';
    html += '<thead><tr><th>Drug Name</th><th>Dosage & Frequency</th><th>System</th></tr></thead>';
    html += '<tbody>';
    medications.forEach(med => {
      const badgeClass = med.system === 'allopathy' ? 'badge-allopathy' : med.system === 'ayush' ? 'badge-ayush' : '';
      const badgeText = med.system === 'allopathy' ? '💊 Allopathy' : med.system === 'ayush' ? '🌿 AYUSH' : 'Unknown';
      const dosageText = [med.dosage, med.frequency].filter(Boolean).join(', ') || '—';

      html += `<tr>
        <td class="font-semibold text-slate-900">${med.name}</td>
        <td class="text-slate-600">${dosageText}</td>
        <td>${badgeClass ? `<span class="badge ${badgeClass}">${badgeText}</span>` : '—'}</td>
      </tr>`;
    });
    html += '</tbody></table></div>';
  }
  html += '</div>';

  html += '</div></div>';
  return html;
}

function renderReconciledProfile(data) {
  const medProfile = data.med_profile || {};
  const allopathy = medProfile.allopathy || [];
  const ayush = medProfile.ayush || [];

  let html = '<div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">';
  html += '<h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">';
  html += '<span>🔄</span> Reconciled Medicine Profile</h2>';
  html += '<div class="space-y-4">';

  // Allopathy card
  html += '<div class="border-l-4 border-blue-500 bg-blue-50 rounded-r-lg p-4">';
  html += '<h3 class="text-sm font-bold text-blue-900 mb-3">💊 Allopathy Medicines</h3>';
  if (allopathy.length > 0) {
    html += '<ul class="space-y-2">';
    allopathy.forEach(med => {
      html += `<li class="text-sm">
        <span class="font-semibold text-slate-900">${med.norm_name || med.name}</span>
        <span class="text-slate-600 text-xs ml-2">${[med.dosage, med.frequency].filter(Boolean).join(', ')}</span>
      </li>`;
    });
    html += '</ul>';
  }
  html += '</div>';

  // AYUSH card
  html += '<div class="border-l-4 border-green-500 bg-green-50 rounded-r-lg p-4">';
  html += '<h3 class="text-sm font-bold text-green-900 mb-3">🌿 AYUSH / Herbal Medicines</h3>';
  if (ayush.length > 0) {
    html += '<ul class="space-y-2">';
    ayush.forEach(med => {
      html += `<li class="text-sm">
        <span class="font-semibold text-slate-900">${med.norm_name || med.name}</span>
        <span class="text-slate-600 text-xs ml-2">${[med.dosage, med.frequency].filter(Boolean).join(', ')}</span>
      </li>`;
    });
    html += '</ul>';
  }
  html += '</div>';

  html += '</div></div>';
  return html;
}

function renderSafetyAlerts(data) {
  const alerts = data.alerts || [];
  const realAlerts = alerts.filter(a => a.interaction_id !== 'unknown-medication-flag');

  let html = '<div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">';
  html += '<h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">';
  html += '<span>⚠️</span> Safety Alerts</h2>';

  if (realAlerts.length === 0) {
    html += `
      <div class="text-center py-8">
        <div class="text-5xl mb-3">✅</div>
        <p class="text-base font-semibold text-green-700">No safety alerts detected</p>
        <p class="text-sm text-slate-500 mt-1">All medication combinations are safe</p>
      </div>
    `;
  } else {
    html += '<div class="space-y-4">';
    realAlerts.forEach(alert => {
      const risk = (alert.risk || 'moderate').toLowerCase();
      const drugA = alert.drug_a || {};
      const drugB = alert.drug_b || {};
      const med1 = drugA.name || 'Unknown';
      const med2 = drugB.name || 'Unknown';

      html += `
        <div class="card-high-risk rounded-lg p-4">
          <div class="flex items-start gap-3">
            <span class="text-2xl flex-shrink-0">⚠️</span>
            <div class="flex-1">
              <h3 class="font-bold text-slate-900 mb-2">
                <span class="text-xs uppercase tracking-wide">[${risk} Risk]</span><br>
                ${med1} + ${med2}
              </h3>
              <div class="space-y-2 text-sm">
                <p><strong class="text-slate-700">Effect:</strong> <span class="text-slate-600">${alert.effect}</span></p>
                <p><strong class="text-slate-700">Mechanism:</strong> <span class="text-slate-600">${alert.mechanism}</span></p>
                <p><strong class="text-slate-700">Recommendation:</strong> <span class="text-slate-600">${alert.recommendation}</span></p>
                ${alert.condition_match ? `<p class="text-xs text-slate-500">✓ Context-aware: Matches patient condition (${(alert.matched_conditions || []).join(', ')})</p>` : ''}
              </div>
            </div>
          </div>
        </div>
      `;
    });
    html += '</div>';
  }

  html += '</div>';
  return html;
}
</script>
